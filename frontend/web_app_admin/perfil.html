<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A minha conta — Gestão de Condomínios</title>
<link rel="stylesheet" href="../visuais/css/tokens.css">
<link rel="stylesheet" href="../visuais/css/base.css">
<link rel="stylesheet" href="../visuais/css/componentes.css">
<link rel="stylesheet" href="../visuais/css/perfil.css">
<link rel="stylesheet" href="css/app.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar"></aside>
    <div>
        <header class="app-topbar"></header>
        <main class="app-main">

            <div class="app-cabecalho">
                <div class="app-cabecalho__titulo">
                    <h1>A minha conta</h1>
                    <p>Gira os seus dados pessoais e acesso à plataforma.</p>
                </div>
            </div>

     
            <div class="perfil-hero">
                <div class="perfil-avatar" id="hero-avatar">--</div>
                <div class="perfil-hero__info">
                    <div class="perfil-badge">Administrador</div>
                    <p class="perfil-nome" id="hero-nome">A carregar...</p>
                    <p class="perfil-email" id="hero-email"></p>
                </div>
            </div>


            <div class="perfil-grelha">

                <div class="perfil-painel">
                    <div class="perfil-painel__cabecalho">
                        <div class="perfil-painel__icone">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <h2 class="perfil-painel__titulo">Dados pessoais</h2>
                    </div>
                    <div class="perfil-painel__corpo">
                        <div id="msg-perfil" class="perfil-msg"></div>
                        <form id="form-perfil">
                            <div class="perfil-campo">
                                <label>Nome completo</label>
                                <input type="text" id="perfil-nome" placeholder="O seu nome">
                            </div>
                            <div class="perfil-campo">
                                <label>Email</label>
                                <input type="email" id="perfil-email" placeholder="email@exemplo.com">
                            </div>
                            <div class="perfil-campo" id="campo-telemovel" style="display:none;">
                                <label>Telemóvel</label>
                                <input type="tel" id="perfil-telemovel" placeholder="+351 9xx xxx xxx">
                            </div>
                            <div class="perfil-campo" id="campo-empresa" style="display:none;">
                                <label>Empresa</label>
                                <input type="text" id="perfil-empresa" placeholder="Nome da empresa">
                            </div>
                            <button type="submit" class="btn btn--primario" style="width:100%;margin-top:8px;">Guardar alterações</button>
                        </form>
                    </div>
                </div>

                <div class="perfil-painel">
                    <div class="perfil-painel__cabecalho">
                        <div class="perfil-painel__icone">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </div>
                        <h2 class="perfil-painel__titulo">Alterar password</h2>
                    </div>
                    <div class="perfil-painel__corpo">
                        <div id="msg-pw" class="perfil-msg"></div>
                        <form id="form-pw">
                            <div class="perfil-campo">
                                <label for="pw-atual">Password atual</label>
                                <input type="password" id="pw-atual" autocomplete="current-password" required placeholder="••••••••">
                            </div>
                            <div class="perfil-campo">
                                <label for="pw-nova">Nova password</label>
                                <input type="password" id="pw-nova" autocomplete="new-password" required placeholder="Mín. 8 caracteres, maiúscula e número">
                            </div>
                            <div class="perfil-campo">
                                <label for="pw-confirmar">Confirmar nova password</label>
                                <input type="password" id="pw-confirmar" autocomplete="new-password" required placeholder="Repetir nova password">
                            </div>
                            <button type="submit" class="btn btn--primario" style="width:100%;margin-top:8px;">Guardar nova password</button>
                        </form>
                    </div>
                </div>

            </div>

        </main>
    </div>
</div>
<script src="../visuais/js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
