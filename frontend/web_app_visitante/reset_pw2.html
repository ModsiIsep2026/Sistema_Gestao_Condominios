<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova password — Sistema de Gestão de Condomínios</title>

    <link rel="stylesheet" href="../visuais/css/tokens.css">
    <link rel="stylesheet" href="../visuais/css/base.css">
    <link rel="stylesheet" href="../visuais/css/componentes.css">
    <link rel="stylesheet" href="css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-fundo">
        <img src="../visuais/img/predios.jpg" alt="">
        <div class="login-fundo__overlay"></div>
    </div>

    <main class="login-conteudo">
        <a href="login.html" class="login-voltar">&larr; Voltar ao login</a>

        <div class="login-card">

            <div class="login-card__topo">
                <a href="index.html" class="login-logo">
                    <img src="../visuais/img/logo.png" alt="Sistema de Gestão de Condomínios">
                </a>
                <h1>Definir nova password</h1>
                <p>Escolha uma nova password para a sua conta.</p>
            </div>

            <div id="reset-erro" class="login-erro" style="display:none"></div>
            <div id="reset-sucesso" class="login-sucesso" style="display:none"></div>

            <form id="reset-form" class="login-form" novalidate>

                <div class="campo">
                    <label for="password">Nova password</label>
                    <div class="password-wrapper">
                        <input type="password"
                               id="password"
                               name="password"
                               autocomplete="new-password"
                               placeholder="••••••••"
                               required>
                        <button type="button" class="toggle-pass" aria-label="Mostrar password" data-target="password">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <small>Mínimo 8 caracteres, com uma maiúscula e um número.</small>
                </div>

                <div class="campo">
                    <label for="confirm_password">Confirmar password</label>
                    <div class="password-wrapper">
                        <input type="password"
                               id="confirm_password"
                               name="confirm_password"
                               autocomplete="new-password"
                               placeholder="••••••••"
                               required>
                        <button type="button" class="toggle-pass" aria-label="Mostrar password" data-target="confirm_password">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn--primario btn--bloco">Guardar nova password</button>

            </form>

            <p class="login-rodape">
                <a href="login.html">Voltar ao login</a>
            </p>

        </div>
    </main>

    <script src="../visuais/js/api.js"></script>
    <script src="js/reset_pw.js"></script>
</body>
</html>
