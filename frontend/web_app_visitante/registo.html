<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=registo_gestor.html">
    <title>Criar conta — Sistema de Gestão de Condomínios</title>

    <link rel="stylesheet" href="../visuais/css/tokens.css">
    <link rel="stylesheet" href="../visuais/css/base.css">
    <link rel="stylesheet" href="../visuais/css/componentes.css">
    <link rel="stylesheet" href="css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-fundo">
        <img src="../visuais/img/predios.jpg" alt="">
        <div class="login-fundo__overlay"></div>
    </div>

    <main class="login-conteudo">
        <a href="login.html" class="login-voltar">&larr; Voltar ao login</a>

        <div class="login-card login-card--largo">

            <div class="login-card__topo">
                <a href="index.html" class="login-logo">
                    <img src="../visuais/img/logo.png" alt="Sistema de Gestão de Condomínios">
                </a>
                <h1>Criar conta</h1>
                <p>Crie a sua conta de condómino para acompanhar o seu edifício.</p>
            </div>

            <div id="registo-erro" class="login-erro" hidden></div>

            <form id="registo-form" class="login-form" novalidate>

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text"
                           id="nome"
                           name="nome"
                           autocomplete="name"
                           placeholder="Gustavo Marques"
                           required>
                </div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email"
                           id="email"
                           name="email"
                           autocomplete="email"
                           placeholder="nome@gmail.com"
                           required>
                </div>

                <div class="campo-dupla">
                    <div class="campo">
                        <label for="telemovel">Telemóvel <span class="campo__opcional">(opcional)</span></label>
                        <input type="tel"
                               id="telemovel"
                               name="telemovel"
                               autocomplete="tel"
                               placeholder="912 345 678">
                    </div>

                    <div class="campo">
                        <label for="nif">NIF <span class="campo__opcional">(opcional)</span></label>
                        <input type="text"
                               id="nif"
                               name="nif"
                               inputmode="numeric"
                               placeholder="123456789"
                               maxlength="9">
                    </div>
                </div>

                <div class="campo">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password"
                               id="password"
                               name="password"
                               autocomplete="new-password"
                               placeholder="••••••••"
                               required>
                        <button type="button" class="toggle-pass" aria-label="Mostrar password" data-target="password">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <small>Mínimo 8 caracteres, com uma maiúscula e um número.</small>
                </div>

                <div class="campo">
                    <label for="password2">Confirmar password</label>
                    <div class="password-wrapper">
                        <input type="password"
                               id="password2"
                               name="password2"
                               autocomplete="new-password"
                               placeholder="••••••••"
                               required>
                        <button type="button" class="toggle-pass" aria-label="Mostrar password" data-target="password2">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn--primario btn--bloco">Criar conta</button>

            </form>

            <p class="login-rodape">
                Já tem conta? <a href="login.html">Entrar</a>
            </p>

        </div>
    </main>

    <script src="../visuais/js/api.js"></script>
    <script src="js/registo.js"></script>
</body>
</html>
