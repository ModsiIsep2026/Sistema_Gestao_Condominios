<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aderir à plataforma — Sistema de Gestão de Condomínios</title>
    <link rel="stylesheet" href="../visuais/css/tokens.css">
    <link rel="stylesheet" href="../visuais/css/base.css">
    <link rel="stylesheet" href="../visuais/css/componentes.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
       
        .passos { display:flex; gap:var(--esp-3); margin-bottom:var(--esp-6); }
        .passo { flex:1; padding:var(--esp-2) var(--esp-3); border-radius:4px; font-size:var(--tam-sm); font-weight:600; text-align:center; background:var(--cor-fundo-alt); color:var(--cor-texto-suave); }
        .passo--ativo { background:var(--cor-primaria); color:#fff; }
        .passo--feito { background:var(--cor-acento); color:#fff; }

        
        .licencas-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:20px; }
        .licenca-card {
            border:2px solid var(--cor-borda); border-radius:6px;
            padding:16px 10px; text-align:center; cursor:pointer;
            background:var(--cor-fundo-alt); transition:all .18s;
        }
        .licenca-card:hover { border-color:var(--cor-primaria); background:#fff; }
        .licenca-card.selecionado { border-color:var(--cor-primaria); background:var(--cor-primaria); color:#fff; }
        .licenca-card__edificios { font-size:26px; font-weight:800; line-height:1; margin-bottom:4px; }
        .licenca-card__label { font-size:11px; font-weight:500; opacity:.75; margin-bottom:10px; }
        .licenca-card__preco { font-size:14px; font-weight:700; }
        .licenca-card__preco small { font-size:11px; font-weight:400; opacity:.8; }

     
        #stripe-card { border:1px solid var(--cor-borda); border-radius:4px; padding:12px; background:#fff; }

      
        .a-carregar-txt { text-align:center; color:var(--cor-texto-suave); font-size:13px; padding:20px 0; }

        
        .meses-grid { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
        .mes-btn {
            flex:1; min-width:70px; padding:10px 8px; text-align:center;
            border:2px solid var(--cor-borda); border-radius:6px;
            background:var(--cor-fundo-alt); cursor:pointer;
            font-family:inherit; font-size:13px; font-weight:600; color:var(--cor-texto-suave);
            transition:all .18s;
        }
        .mes-btn:hover { border-color:var(--cor-primaria); color:var(--cor-primaria); background:#fff; }
        .mes-btn.selecionado { border-color:var(--cor-primaria); background:var(--cor-primaria); color:#fff; }
        .mes-btn__desconto { display:block; font-size:10px; font-weight:500; margin-top:2px; opacity:.8; }

     
        #stripe-secao { transition: opacity .25s; }
        #stripe-secao.oculto { opacity:0; pointer-events:none; height:0; overflow:hidden; }
    </style>
</head>
<body class="login-body">

    <div class="login-fundo">
        <img src="../visuais/img/predios.jpg" alt="">
        <div class="login-fundo__overlay"></div>
    </div>

    <main class="login-conteudo">
        <a href="login.html" class="login-voltar">&larr; Já tenho conta</a>

        <div class="login-card login-card--largo">

            <div class="login-card__topo">
                <a href="index.html" class="login-logo">
                    <img src="../visuais/img/logo.png" alt="Sistema de Gestão de Condomínios">
                </a>
                <h1>Crie a sua conta de gestor em 2 passos.</h1>
            </div>

            <div class="passos">
                <div class="passo passo--ativo" id="passo-1-ind">1. Os seus dados</div>
                <div class="passo" id="passo-2-ind">2. Pagamento</div>
            </div>

            <div id="msg-erro" class="login-erro" style="display:none"></div>


            <form id="form-dados" class="login-form" novalidate>
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="João Silva" required autocomplete="name">
                </div>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="joao@empresa.pt" required autocomplete="email">
                </div>
                <div class="campo-dupla">
                    <div class="campo">
                        <label for="telemovel">Telemóvel</label>
                        <input type="tel" id="telemovel" placeholder="912 345 678" required autocomplete="tel">
                    </div>
                    <div class="campo">
                        <label for="nif">NIF <span class="campo__opcional">(opcional)</span></label>
                        <input type="text" id="nif" placeholder="123456789" maxlength="9" inputmode="numeric">
                    </div>
                </div>
                <button type="submit" class="btn btn--primario btn--bloco" id="btn-avancar">
                    Escolher plano →
                </button>
            </form>


            <div id="secao-pagamento" style="display:none;">

             
                <p style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--cor-texto);">
                    Escolha o seu plano
                </p>
                <div id="licencas-container">
                    <div class="a-carregar-txt">A carregar planos…</div>
                </div>

                <div id="meses-secao" style="display:none;">
                    <p style="font-size:13px;font-weight:600;margin:4px 0 10px;color:var(--cor-texto);">
                        Duração do contrato
                    </p>
                    <div class="meses-grid">
                        <button type="button" class="mes-btn" data-meses="1">1 mês</button>
                        <button type="button" class="mes-btn" data-meses="3">3 meses</button>
                        <button type="button" class="mes-btn" data-meses="6">6 meses</button>
                        <button type="button" class="mes-btn" data-meses="12">12 meses</button>
                    </div>
                </div>

                <div id="stripe-secao" class="oculto">
                    <hr style="border:none;border-top:1px solid var(--cor-borda);margin:20px 0;">

  
                    <div id="resumo-plano" style="
                        display:flex; align-items:center; gap:16px;
                        background:var(--cor-fundo-alt); border:2px solid var(--cor-primaria);
                        border-radius:8px; padding:16px 20px; margin-bottom:20px;">
                        <div style="text-align:center; min-width:72px;">
                            <div id="resumo-edificios" style="font-size:32px;font-weight:800;color:var(--cor-primaria);line-height:1;"></div>
                            <div id="resumo-label-ed" style="font-size:11px;font-weight:500;color:var(--cor-texto-suave);"></div>
                        </div>
                        <div style="flex:1;border-left:1px solid var(--cor-borda);padding-left:16px;">
                            <div style="font-size:13px;color:var(--cor-texto-suave);margin-bottom:2px;">Plano selecionado</div>
                            <div id="resumo-mensal" style="font-size:14px;color:var(--cor-texto-suave);"></div>
                            <div id="resumo-preco" style="font-size:22px;font-weight:800;color:var(--cor-primaria);margin:4px 0 2px;"></div>
                            <div id="resumo-detalhe" style="font-size:12px;color:var(--cor-texto-suave);"></div>
                        </div>
                    </div>

                    <form id="form-pagamento" class="login-form">
                        <div class="campo">
                            <label>Dados do cartão</label>
                            <div id="stripe-card"></div>
                            <div id="stripe-erro" style="color:var(--cor-erro);font-size:var(--tam-sm);margin-top:6px;"></div>
                        </div>
                        <button type="submit" class="btn btn--primario btn--bloco" id="btn-pagar">
                            Confirmar pagamento
                        </button>
                    </form>
                </div>

                <button type="button" class="btn btn--outline btn--bloco" id="btn-voltar"
                        style="margin-top:var(--esp-3);">← Voltar aos dados</button>
            </div>

        </div>
    </main>

    <script src="../visuais/js/api.js"></script>
    <script src="../visuais/js/toast.js"></script>
    <script src="js/registo_gestor.js"></script>
</body>
</html>
