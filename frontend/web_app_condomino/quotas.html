<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As minhas quotas — Gestão de Condomínios</title>
    <link rel="stylesheet" href="../visuais/css/tokens.css">
    <link rel="stylesheet" href="../visuais/css/base.css">
    <link rel="stylesheet" href="../visuais/css/componentes.css">
    <link rel="stylesheet" href="css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">

    <div class="app-shell">
        <aside class="app-sidebar"></aside>

        <div>
            <header class="app-topbar"></header>
            <main class="app-main">

                <div class="app-cabecalho">
                    <div class="app-cabecalho__titulo">
                        <h1>As minhas quotas</h1>
                        <p>Histórico de quotas mensais do seu apartamento.</p>
                    </div>
                </div>

                <div class="app-filtros">
                    <input type="search" placeholder="Procurar por mês..." data-pesquisa>
                    <select id="filtro-estado">
                        <option value="">Todos os estados</option>
                        <option value="pago">Apenas pagas</option>
                        <option value="pendente">Apenas pendentes</option>
                    </select>
                </div>

                <div class="painel">
                    <table class="app-tabela">
                        <thead>
                            <tr>
                                <th>Mês</th>
                                <th>Valor</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody data-tabela="quotas">
                            <tr><td colspan="4" class="app-vazio"><p>A carregar...</p></td></tr>
                        </tbody>
                    </table>
                </div>

            </main>
        </div>
    </div>

    <script src="../visuais/js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/quotas.js"></script>
</body>
</html>
