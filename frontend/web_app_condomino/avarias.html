<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar avaria - Gestao de Condominios</title>
    <link rel="stylesheet" href="../visuais/css/tokens.css">
    <link rel="stylesheet" href="../visuais/css/base.css">
    <link rel="stylesheet" href="../visuais/css/componentes.css">
    <link rel="stylesheet" href="css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">

    <div class="app-shell">
        <aside class="app-sidebar"></aside>

        <div>
            <header class="app-topbar"></header>
            <main class="app-main">

                <div class="app-cabecalho">
                    <div class="app-cabecalho__titulo">
                        <h1>Reportar avaria</h1>
                        <p>Comunique problemas no seu edificio ou nas zonas comuns.</p>
                    </div>
                    <div class="app-cabecalho__acoes">
                        <button type="button" class="btn btn--primario" id="btn-reportar">Nova avaria</button>
                    </div>
                </div>

                <div class="painel">
                    <table class="app-tabela">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Local</th>
                                <th>Descricao</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody data-tabela="avarias">
                            <tr><td colspan="4" class="app-vazio"><p>A carregar...</p></td></tr>
                        </tbody>
                    </table>
                </div>

            </main>
        </div>
    </div>

    <div class="modal-overlay" id="modal-avaria" hidden>
        <div class="modal">
            <div class="modal__cabecalho">
                <h3>Reportar avaria</h3>
                <button type="button" class="modal__fechar" data-fechar-modal>&times;</button>
            </div>
            <div class="modal__corpo">
                <div id="erro-avaria" class="login-erro" style="display:none"></div>
                <form id="form-avaria">
                    <div class="campo">
                        <label for="a-zona">Local da avaria</label>
                        <input type="text" id="a-zona" required
                               placeholder="Ex: Entrada do edificio, escadas, elevador, garagem...">
                    </div>
                    <div class="campo">
                        <label for="a-descricao">Descricao (opcional)</label>
                        <textarea id="a-descricao" rows="3"
                                  placeholder="Descreva o problema com o maximo de detalhe possivel..."
                                  style="width:100%;padding:10px 14px;border:1px solid var(--cor-borda);
                                         font-family:inherit;font-size:var(--tam-sm);resize:vertical;"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal__rodape">
                <button type="button" class="btn btn--outline" data-fechar-modal>Cancelar</button>
                <button type="button" class="btn btn--primario" id="btn-submeter-avaria">Reportar avaria</button>
            </div>
        </div>
    </div>

    <script src="../visuais/js/api.js"></script>
    <script src="../visuais/js/toast.js"></script>
    <script src="js/app.js"></script>
    <script src="js/avarias.js"></script>
</body>
</html>
