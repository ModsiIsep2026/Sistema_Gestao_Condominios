<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar espaco - Gestao de Condominios</title>
    <link rel="stylesheet" href="../visuais/css/tokens.css">
    <link rel="stylesheet" href="../visuais/css/base.css">
    <link rel="stylesheet" href="../visuais/css/componentes.css">
    <link rel="stylesheet" href="css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">

    <div class="app-shell">
        <aside class="app-sidebar"></aside>

        <div>
            <header class="app-topbar"></header>
            <main class="app-main">

                <div class="app-cabecalho">
                    <div class="app-cabecalho__titulo">
                        <h1>Reservar espaco</h1>
                        <p>Veja os espacos comuns do seu edificio e reserve por dias.</p>
                    </div>
                    <div class="app-cabecalho__acoes">
                        <button type="button" class="btn btn--primario" id="btn-nova-reserva">Nova reserva</button>
                    </div>
                </div>

                <div class="painel" style="margin-bottom:var(--esp-5);">
                    <div class="painel__cabecalho">
                        <h2>As minhas reservas</h2>
                    </div>
                    <div class="painel__corpo painel__corpo--sem-pad">
                        <table class="app-tabela">
                            <thead>
                                <tr>
                                    <th>Espaco</th>
                                    <th>Inicio</th>
                                    <th>Fim</th>
                                    <th>Valor</th>
                                </tr>
                            </thead>
                            <tbody data-tabela="minhas-reservas">
                                <tr><td colspan="4" class="app-vazio"><p>A carregar...</p></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                

            </main>
        </div>
    </div>

    <div class="modal-overlay" id="modal-reserva" hidden>
        <div class="modal">
            <div class="modal__cabecalho">
                <h3>Nova reserva</h3>
                <button type="button" class="modal__fechar" data-fechar-modal>&times;</button>
            </div>
            <div class="modal__corpo">
                <div id="erro-reserva" class="login-erro" style="display:none"></div>
                <form id="form-reserva">
                    <div class="campo">
                        <label for="r-espaco">Espaco</label>
                        <select id="r-espaco" required></select>
                    </div>
                    <div class="campo">
                        <label for="r-inicio">Dia de inicio</label>
                        <input type="date" id="r-inicio" required>
                    </div>
                    <div class="campo">
                        <label for="r-fim">Dia de fim</label>
                        <input type="date" id="r-fim" required>
                    </div>
                    <div id="dias-indisponiveis"
                         style="background:var(--cor-fundo-alt);border:1px solid var(--cor-borda);padding:var(--esp-3);font-size:var(--tam-sm);color:var(--cor-texto-suave);">
                        Escolha um espaco para ver os dias ja reservados.
                    </div>
                </form>
            </div>
            <div class="modal__rodape">
                <button type="button" class="btn btn--outline" data-fechar-modal>Cancelar</button>
                <button type="button" class="btn btn--primario" id="btn-confirmar-reserva">Confirmar reserva</button>
            </div>
        </div>
    </div>

    <script src="../visuais/js/api.js"></script>
    <script src="../visuais/js/toast.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reservas.js"></script>
</body>
</html>
