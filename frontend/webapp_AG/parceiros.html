<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parceiros — Gestão de Condomínios</title>
<link rel="stylesheet" href="../visuais/css/tokens.css">
<link rel="stylesheet" href="../visuais/css/base.css">
<link rel="stylesheet" href="../visuais/css/componentes.css">
<link rel="stylesheet" href="css/app.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar"></aside>
    <div>
        <header class="app-topbar"></header>
        <main class="app-main">

            <div class="app-cabecalho">
                <div class="app-cabecalho__titulo">
                    <h1>Parceiros</h1>
                    <p>Empresas e prestadores de serviços externos ao condomínio.</p>
                </div>
                <div class="app-cabecalho__acoes">
                    <button type="button" class="btn btn--primario" id="btn-novo">Adicionar parceiro</button>
                </div>
            </div>

            <div class="app-filtros">
                <input type="search" placeholder="Procurar por nome, serviço ou localização..." data-pesquisa>
            </div>

            <div class="painel">
                <table class="app-tabela">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Serviço</th>
                            <th>Localização</th>
                            <th>Site</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody data-tabela="fornecedores">
                        <tr><td colspan="5" class="app-vazio"><p>A carregar...</p></td></tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>
</div>

<!-- Modal de criar/editar parceiro -->
<div class="modal-overlay" id="modal-fornecedor" hidden>
    <div class="modal">
        <div class="modal__cabecalho">
            <h3 id="modal-titulo">Adicionar parceiro</h3>
            <button type="button" class="modal__fechar" data-fechar-modal>&times;</button>
        </div>
        <div class="modal__corpo">
            <div id="erro-fornecedor" class="login-erro" hidden></div>
            <form id="form-fornecedor">
                <input type="hidden" id="f-id">
                <div class="campo">
                    <label for="f-nome">Nome da empresa</label>
                    <input type="text" id="f-nome" placeholder="Ex: Otis Portugal" required>
                </div>
                <div class="campo">
                    <label for="f-servico">Serviço</label>
                    <input type="text" id="f-servico" placeholder="Ex: Elevadores, Canalização, Eletricidade…">
                </div>
                <div class="campo">
                    <label for="f-localizacao">Localização</label>
                    <input type="text" id="f-localizacao" placeholder="Ex: Lisboa, Porto…">
                </div>
                <div class="campo">
                    <label for="f-site">Site</label>
                    <input type="text" id="f-site" placeholder="https://www.exemplo.pt">
                </div>
            </form>
        </div>
        <div class="modal__rodape">
            <button type="button" class="btn btn--outline" data-fechar-modal>Cancelar</button>
            <button type="button" class="btn btn--primario" id="btn-guardar">Guardar</button>
        </div>
    </div>
</div>

<!-- Modal de confirmação -->
<div class="modal-overlay" id="modal-confirmar" hidden>
    <div class="modal" style="max-width:400px;">
        <div class="modal__cabecalho">
            <h3>Confirmar ação</h3>
            <button type="button" class="modal__fechar" id="confirmar-cancelar">&times;</button>
        </div>
        <div class="modal__corpo">
            <p id="confirmar-texto"></p>
        </div>
        <div class="modal__rodape">
            <button type="button" class="btn btn--outline" id="confirmar-cancelar2">Cancelar</button>
            <button type="button" class="btn btn--perigo" id="confirmar-ok">Confirmar</button>
        </div>
    </div>
</div>

<script src="../visuais/js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/fornecedores.js"></script>
</body>
</html>
