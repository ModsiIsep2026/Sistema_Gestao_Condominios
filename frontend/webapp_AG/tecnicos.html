<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Técnicos — Gestão de Condomínios</title>
<link rel="stylesheet" href="../visuais/css/tokens.css">
<link rel="stylesheet" href="../visuais/css/base.css">
<link rel="stylesheet" href="../visuais/css/componentes.css">
<link rel="stylesheet" href="css/app.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar"></aside>
    <div>
        <header class="app-topbar"></header>
        <main class="app-main">
            <div class="app-cabecalho">
                <div class="app-cabecalho__titulo">
                    <h1>Técnicos</h1>
                    <p>Equipa técnica que executa ordens de trabalho.</p>
                </div>
                <div class="app-cabecalho__acoes">
                    <button type="button" class="btn btn--primario" id="btn-novo-tecnico">Adicionar técnico</button>
                </div>
            </div>
            <div class="app-filtros">
                <input type="search" placeholder="Procurar por nome ou email..." data-pesquisa>
                <select id="filtro-estado">
                    <option value="todos">Todos os estados</option>
                    <option value="ativos" selected>Apenas ativos</option>
                    <option value="inativos">Apenas inativos</option>
                </select>
            </div>
            <div class="painel">
                <table class="app-tabela">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Função</th>
                            <th>Email</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody data-tabela="tecnicos"><tr><td colspan="5" class="app-vazio"><p>A carregar...</p></td></tr></tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<!-- Modal: adicionar técnico -->
<div class="modal-overlay" id="modal-tecnico" hidden>
    <div class="modal">
        <div class="modal__cabecalho">
            <h3>Adicionar técnico</h3>
            <button type="button" class="modal__fechar" data-fechar-modal>&times;</button>
        </div>
        <div class="modal__corpo">
            <div id="erro-tecnico" class="login-erro" hidden></div>
            <form id="form-tecnico">
                <div class="campo">
                    <label for="t-nome">Nome completo</label>
                    <input type="text" id="t-nome" required>
                </div>
                <div class="campo">
                    <label for="t-funcao">Função / especialidade</label>
                    <input type="text" id="t-funcao" placeholder="Ex: Electricista, Canalizador…">
                </div>
                <div class="campo">
                    <label for="t-email">Email</label>
                    <input type="email" id="t-email" required>
                </div>
                <div class="campo">
                    <label for="t-pw">Password inicial</label>
                    <input type="password" id="t-pw" required autocomplete="new-password">
                </div>
            </form>
        </div>
        <div class="modal__rodape">
            <button type="button" class="btn btn--outline" data-fechar-modal>Cancelar</button>
            <button type="button" class="btn btn--primario" id="btn-criar-tecnico">Adicionar</button>
        </div>
    </div>
</div>

<script src="../visuais/js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/tecnicos.js"></script>
</body>
</html>
