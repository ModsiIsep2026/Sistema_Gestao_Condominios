<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Técnicos — Sistema de Gestão de Condomínios</title>
<link rel="stylesheet" href="../shared/css/tokens.css">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/componentes.css">
<link rel="stylesheet" href="css/app.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body" data-pagina-admin="true">
<div class="app-shell">
    <aside class="app-sidebar"></aside>
    <div>
        <header class="app-topbar"></header>
        <main class="app-main">

            <div class="app-cabecalho">
                <div class="app-cabecalho__titulo">
                    <h1>Técnicos</h1>
                    <p>Profissionais técnicos que executam ordens de trabalho na plataforma.</p>
                </div>
                <div class="app-cabecalho__acoes">
                    <button type="button" class="btn btn--primario" id="btn-novo-gestor">Adicionar técnico</button>
                </div>
            </div>

            <div class="app-filtros">
                <input type="search" placeholder="Procurar por nome ou email..." data-pesquisa>
                <select id="filtro-estado">
                    <option value="todos">Todos os estados</option>
                    <option value="ativos" selected>Apenas ativos</option>
                    <option value="inativos">Apenas inativos</option>
                </select>
            </div>

            <div class="painel">
                <table class="app-tabela">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Telemóvel</th>
                            <th>NIF</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody data-tabela="gestores"><tr><td colspan="6" class="app-vazio"><p>A carregar...</p></td></tr></tbody>
                </table>
            </div>

        </main>
    </div>
</div>

<!-- Modal: criar técnico -->
<div class="modal-overlay" id="modal-gestor" hidden>
    <div class="modal">
        <div class="modal__cabecalho">
            <h3>Convidar técnico</h3>
            <button type="button" class="modal__fechar" data-fechar-modal>&times;</button>
        </div>
        <div class="modal__corpo">
            <div id="erro-gestor" class="login-erro" hidden></div>
            <p class="texto-suave" style="margin-bottom:var(--esp-4);font-size:var(--tam-sm);">
                Uma password aleatória será gerada e enviada para o email indicado.
            </p>
            <form id="form-gestor">
                <div class="campo">
                    <label for="g-nome">Nome completo</label>
                    <input type="text" id="g-nome" required>
                </div>
                <div class="campo">
                    <label for="g-email">Email</label>
                    <input type="email" id="g-email" required>
                </div>
                <div class="campo-dupla" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--esp-3);">
                    <div class="campo">
                        <label for="g-telemovel">Telemóvel</label>
                        <input type="tel" id="g-telemovel">
                    </div>
                    <div class="campo">
                        <label for="g-nif">NIF</label>
                        <input type="text" id="g-nif" maxlength="9">
                    </div>
                </div>
            </form>
        </div>
        <div class="modal__rodape">
            <button type="button" class="btn btn--outline" data-fechar-modal>Cancelar</button>
            <button type="button" class="btn btn--primario" id="btn-criar-gestor">Convidar</button>
        </div>
    </div>
</div>

<script src="../shared/js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/listagem.js"></script>
<script src="js/gestores.js"></script>
</body>
</html>
