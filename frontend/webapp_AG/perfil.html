<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A minha conta — Gestão de Condomínios</title>
<link rel="stylesheet" href="../visuais/css/tokens.css">
<link rel="stylesheet" href="../visuais/css/base.css">
<link rel="stylesheet" href="../visuais/css/componentes.css">
<link rel="stylesheet" href="css/app.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar"></aside>
    <div>
        <header class="app-topbar"></header>
        <main class="app-main">

            <div class="app-cabecalho">
                <div class="app-cabecalho__titulo">
                    <h1>A minha conta</h1>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 380px 380px; gap:var(--esp-5); align-items:start;">

                <div class="painel">
                    <div class="painel__cabecalho"><h2>Dados pessoais</h2></div>
                    <div class="painel__corpo">
                        <form id="form-perfil">
                            <div id="msg-perfil" style="display:none; margin-bottom:var(--esp-3);"></div>
                            <div class="campo"><label>Nome</label><input type="text" id="perfil-nome"></div>
                            <div class="campo"><label>Email</label><input type="email" id="perfil-email"></div>
                            <div class="campo" id="campo-telemovel" style="display:none;"><label>Telemóvel</label><input type="tel" id="perfil-telemovel"></div>
                            <div class="campo" id="campo-empresa" style="display:none;"><label>Empresa</label><input type="text" id="perfil-empresa"></div>
                            <div style="margin-top:var(--esp-4);">
                                <button type="submit" class="btn btn--primario">Guardar alterações</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="painel">
                    <div class="painel__cabecalho"><h2>Alterar Password</h2></div>
                    <div class="painel__corpo">
                        <div id="msg-pw" style="display:none; margin-bottom:var(--esp-3);"></div>
                        <form id="form-pw">
                            <div class="campo">
                                <label for="pw-atual">Password atual</label>
                                <input type="password" id="pw-atual" autocomplete="current-password" required>
                            </div>
                            <div class="campo">
                                <label for="pw-nova">Nova password</label>
                                <input type="password" id="pw-nova" autocomplete="new-password" required
                                       placeholder="Mínimo 8 caracteres, maiúscula e número">
                            </div>
                            <div class="campo">
                                <label for="pw-confirmar">Confirmar nova password</label>
                                <input type="password" id="pw-confirmar" autocomplete="new-password" required>
                            </div>
                            <div style="margin-top:var(--esp-4);">
                                <button type="submit" class="btn btn--primario">Guardar nova password</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>

        </main>
    </div>
</div>
<script src="../visuais/js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
