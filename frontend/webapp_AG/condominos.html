<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condóminos — Gestão de Condomínios</title>
<link rel="stylesheet" href="../visuais/css/tokens.css">
<link rel="stylesheet" href="../visuais/css/base.css">
<link rel="stylesheet" href="../visuais/css/componentes.css">
<link rel="stylesheet" href="css/app.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar"></aside>
    <div>
        <header class="app-topbar"></header>
        <main class="app-main">
            <div class="app-cabecalho">
                <div class="app-cabecalho__titulo">
                    <h1>Condóminos</h1>
                    <p>Pessoas com fração nos seus edifícios.</p>
                </div>
                <div class="app-cabecalho__acoes">
                    <button type="button" class="btn btn--primario" id="btn-novo-condomino">Adicionar condómino</button>
                </div>
            </div>
            <div class="app-filtros">
                <input type="search" placeholder="Procurar por nome ou email..." data-pesquisa>
            </div>
            <div class="painel">
                <table class="app-tabela">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Telemóvel</th>
                            <th>Apartamento</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody data-tabela="condominos"><tr><td colspan="5" class="app-vazio"><p>A carregar...</p></td></tr></tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<!-- Modal: adicionar condómino -->
<div class="modal-overlay" id="modal-condomino" hidden>
    <div class="modal">
        <div class="modal__cabecalho">
            <h3>Adicionar condómino</h3>
            <button type="button" class="modal__fechar" data-fechar-modal>&times;</button>
        </div>
        <div class="modal__corpo">
            <div id="erro-condomino" class="login-erro" hidden></div>
            <form id="form-condomino">
                <div class="campo">
                    <label for="c-nome">Nome completo</label>
                    <input type="text" id="c-nome" required>
                </div>
                <div class="campo">
                    <label for="c-email">Email</label>
                    <input type="email" id="c-email" required>
                </div>
                <div class="campo">
                    <label for="c-telemovel">Telemóvel</label>
                    <input type="tel" id="c-telemovel" required>
                </div>
                <div class="campo">
                    <label for="c-apartamento">ID do apartamento</label>
                    <input type="number" id="c-apartamento" min="1" required>
                </div>
                <div class="campo">
                    <label for="c-pw">Password inicial</label>
                    <input type="password" id="c-pw" required autocomplete="new-password">
                </div>
            </form>
        </div>
        <div class="modal__rodape">
            <button type="button" class="btn btn--outline" data-fechar-modal>Cancelar</button>
            <button type="button" class="btn btn--primario" id="btn-criar-condomino">Adicionar</button>
        </div>
    </div>
</div>

<script src="../visuais/js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/condominos.js"></script>
</body>
</html>
