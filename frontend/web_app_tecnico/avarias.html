<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avarias — Técnico</title>
    <link rel="stylesheet" href="../visuais/css/tokens.css">
    <link rel="stylesheet" href="../visuais/css/base.css">
    <link rel="stylesheet" href="../visuais/css/componentes.css">
    <link rel="stylesheet" href="css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .estado--nova { background:#EEF2FF; color:#3730A3; font-size:11px; font-weight:600; padding:3px 8px; border-radius:4px; }
        .estado--prog { background:#FFF7ED; color:#C2410C; font-size:11px; font-weight:600; padding:3px 8px; border-radius:4px; }
        .estado--ok   { background:#F0FDF4; color:#15803D; font-size:11px; font-weight:600; padding:3px 8px; border-radius:4px; }
        .av-desc-completa { font-size:13px; color:var(--cor-texto-secundario); white-space:pre-wrap; max-height:120px; overflow:auto; }
    </style>
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar"></aside>
    <div>
        <header class="app-topbar"></header>
        <main class="app-main">

            <div class="app-cabecalho">
                <div class="app-cabecalho__titulo">
                    <h1>As minhas avarias</h1>
                    <p>Avarias que lhe foram atribuídas.</p>
                </div>
            </div>

            <div class="app-filtros">
                <input type="search" placeholder="Procurar por zona ou descrição..." data-pesquisa>
                <select id="filtro-estado">
                    <option value="">Todos os estados</option>
                    <option value="pendente">Pendentes</option>
                    <option value="resolvida">Resolvidas</option>
                </select>
            </div>

            <div class="painel">
                <table class="app-tabela">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Zona</th>
                            <th>Descrição</th>
                            <th>Local</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody data-tabela="avarias">
                        <tr><td colspan="6" class="app-vazio"><p>A carregar...</p></td></tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>
</div>

<div class="modal-overlay" id="modal-detalhe" hidden>
    <div class="modal" style="max-width:500px;">
        <div class="modal__cabecalho">
            <h3>Detalhe da avaria</h3>
            <button type="button" class="modal__fechar" data-fechar-modal-detalhe>&times;</button>
        </div>
        <div class="modal__corpo" id="detalhe-corpo" style="font-size:14px;line-height:1.7;"></div>
        <div class="modal__rodape">
            <button type="button" class="btn btn--outline" data-fechar-modal-detalhe>Fechar</button>
        </div>
    </div>
</div>

<script src="../visuais/js/api.js"></script>
<script src="../visuais/js/toast.js"></script>
<script src="js/app.js"></script>
<script src="js/avarias.js"></script>
</body>
</html>
