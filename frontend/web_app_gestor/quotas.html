<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamentos — Gestão de Condomínios</title>
<link rel="stylesheet" href="../visuais/css/tokens.css">
<link rel="stylesheet" href="../visuais/css/base.css">
<link rel="stylesheet" href="../visuais/css/componentes.css">
<link rel="stylesheet" href="css/app.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    .apt-check-lista { max-height: 240px; overflow-y: auto; border: 1px solid var(--cor-borda);
                       border-radius: 6px; margin-top: var(--esp-2); }
    .apt-check-item  { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
                       border-bottom: 1px solid var(--cor-borda); font-size: 14px; cursor: pointer; }
    .apt-check-item:last-child { border-bottom: none; }
    .apt-check-item:hover { background: var(--cor-fundo); }
    .apt-check-item input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--cor-primaria); }
    .apt-check-selecionar-todos { display: flex; align-items: center; gap: 8px;
                                  font-size: 13px; font-weight: 600; padding: 8px 14px;
                                  border-bottom: 2px solid var(--cor-borda);
                                  background: var(--cor-fundo); cursor: pointer; }
    .apt-check-selecionar-todos input { width: 16px; height: 16px; accent-color: var(--cor-primaria); }
</style>
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar"></aside>
    <div>
        <header class="app-topbar"></header>
        <main class="app-main">

            <div class="app-cabecalho">
                <div class="app-cabecalho__titulo">
                    <h1>Pagamentos</h1>
                    <p>Quotas mensais de todos os apartamentos nos seus edifícios.</p>
                </div>
                <div class="app-cabecalho__acoes">
                    <button type="button" class="btn btn--primario" id="btn-gerar-quota">Gerar quota</button>
                </div>
            </div>

            <div class="kpis" style="grid-template-columns:repeat(4,1fr);">
                <div class="kpi">
                    <div class="kpi__rotulo">Total de quotas</div>
                    <div class="kpi__valor" id="resumo-total">0</div>
                </div>
                <div class="kpi kpi--ok">
                    <div class="kpi__rotulo">Pagas</div>
                    <div class="kpi__valor" id="resumo-pagos">0</div>
                </div>
                <div class="kpi kpi--alerta">
                    <div class="kpi__rotulo">Pendentes</div>
                    <div class="kpi__valor" id="resumo-pendentes">0</div>
                </div>
                <div class="kpi">
                    <div class="kpi__rotulo">Montante cobrado</div>
                    <div class="kpi__valor" id="resumo-montante" style="font-size:24px;">0,00 €</div>
                </div>
            </div>

            <div class="app-filtros">
                <select id="filtro-edificio">
                    <option value="">Todos os edifícios</option>
                </select>
                <input type="search" placeholder="Procurar por mês ou apartamento..." data-pesquisa>
                <select id="filtro-estado">
                    <option value="">Todos os estados</option>
                    <option value="pago">Pagas</option>
                    <option value="pendente">Pendentes</option>
                </select>
            </div>

            <div class="painel">
                <table class="app-tabela">
                    <thead>
                        <tr>
                            <th>Apartamento</th>
                            <th>Mês</th>
                            <th>Valor</th>
                            <th>Estado</th>
                            <th>Data pagamento</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody data-tabela="quotas"><tr><td colspan="6" class="app-vazio"><p>A carregar...</p></td></tr></tbody>
                </table>
            </div>

        </main>
    </div>
</div>

<!-- ── Modal: gerar quota ──────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-gerar" hidden>
    <div class="modal" style="max-width:500px;">
        <div class="modal__cabecalho">
            <h3>Gerar quota mensal</h3>
            <button type="button" class="modal__fechar" id="btn-fechar-gerar">&times;</button>
        </div>
        <div class="modal__corpo">
            <div id="erro-gerar" class="login-erro" style="display:none;margin-bottom:var(--esp-3);"></div>
            <div id="sucesso-gerar" class="login-sucesso" style="display:none;margin-bottom:var(--esp-3);"></div>

            <div class="campo">
                <label for="g-edificio">Edifício</label>
                <select id="g-edificio">
                    <option value="">Selecione um edifício...</option>
                </select>
            </div>
            <div class="campo">
                <label for="g-mes">Mês</label>
                <input type="month" id="g-mes">
            </div>

            <!-- Lista de apartamentos com checkboxes -->
            <div id="g-apts-wrapper" style="display:none;">
                <label style="font-size:13px;font-weight:600;color:var(--cor-texto-secundario);
                              text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:var(--esp-2);">
                    Apartamentos
                </label>
                <div class="apt-check-lista">
                    <label class="apt-check-selecionar-todos">
                        <input type="checkbox" id="g-todos">
                        Selecionar todos
                    </label>
                    <div id="g-apts-lista"></div>
                </div>
                <p id="g-apts-info" style="font-size:12px;color:var(--cor-texto-secundario);margin-top:var(--esp-2);"></p>
            </div>

            <div id="g-sem-apts" style="display:none;font-size:13px;color:var(--cor-texto-secundario);
                                        padding:12px;text-align:center;">
                Este edifício não tem apartamentos registados.
            </div>
        </div>
        <div class="modal__rodape">
            <button type="button" class="btn btn--outline" id="btn-fechar-gerar2">Cancelar</button>
            <button type="button" class="btn btn--primario" id="btn-gerar" disabled>Gerar quota</button>
        </div>
    </div>
</div>

<script src="../visuais/js/api.js"></script>
<script src="../visuais/js/toast.js"></script>
<script src="js/app.js"></script>
<script src="js/quotas.js"></script>
</body>
</html>
