<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamentos — Gestão de Condomínios</title>
<link rel="stylesheet" href="../visuais/css/tokens.css">
<link rel="stylesheet" href="../visuais/css/base.css">
<link rel="stylesheet" href="../visuais/css/componentes.css">
<link rel="stylesheet" href="css/app.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar"></aside>
    <div>
        <header class="app-topbar"></header>
        <main class="app-main">

            <div class="app-cabecalho">
                <div class="app-cabecalho__titulo">
                    <h1>Pagamentos</h1>
                    <p>Quotas mensais de todos os apartamentos nos seus edifícios.</p>
                </div>
            </div>

            <!-- KPIs -->
            <div class="kpis" style="grid-template-columns:repeat(4,1fr);">
                <div class="kpi">
                    <div class="kpi__rotulo">Total de quotas</div>
                    <div class="kpi__valor" id="resumo-total">0</div>
                </div>
                <div class="kpi kpi--ok">
                    <div class="kpi__rotulo">Pagas</div>
                    <div class="kpi__valor" id="resumo-pagos">0</div>
                </div>
                <div class="kpi kpi--alerta">
                    <div class="kpi__rotulo">Pendentes</div>
                    <div class="kpi__valor" id="resumo-pendentes">0</div>
                </div>
                <div class="kpi">
                    <div class="kpi__rotulo">Montante cobrado</div>
                    <div class="kpi__valor" id="resumo-montante" style="font-size:24px;">0,00 €</div>
                </div>
            </div>

            <!-- Filtros -->
            <div class="app-filtros">
                <select id="filtro-edificio">
                    <option value="">Todos os edifícios</option>
                </select>
                <input type="month" id="filtro-mes">
                <select id="filtro-estado">
                    <option value="">Todos os estados</option>
                    <option value="pago">Pagas</option>
                    <option value="pendente">Pendentes</option>
                </select>
                <button type="button" class="btn btn--primario" id="btn-gerar-quota" disabled>
                    Gerar quota
                </button>
            </div>

            <div class="painel">
                <table class="app-tabela">
                    <thead>
                        <tr>
                            <th>Apartamento</th>
                            <th>Mês</th>
                            <th>Valor</th>
                            <th>Estado</th>
                            <th>Data pagamento</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody data-tabela="quotas">
                        <tr><td colspan="6" class="app-vazio"><p>A carregar...</p></td></tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>
</div>

<script src="../visuais/js/api.js"></script>
<script src="../visuais/js/toast.js"></script>
<script src="js/app.js"></script>
<script src="js/quotas.js"></script>
</body>
</html>
