<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A minha conta — Gestão de Condomínios</title>
<link rel="stylesheet" href="../visuais/css/tokens.css">
<link rel="stylesheet" href="../visuais/css/base.css">
<link rel="stylesheet" href="../visuais/css/componentes.css">
<link rel="stylesheet" href="css/app.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── Hero de Perfil ─────────────────────────────── */
.perfil-hero {
    background: linear-gradient(130deg, #0B2240 0%, #1A3D6B 100%);
    border-radius: 16px;
    padding: 40px 48px;
    display: flex;
    align-items: center;
    gap: 32px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
}
.perfil-hero::before {
    content: '';
    position: absolute;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    right: -80px; top: -100px;
    pointer-events: none;
}
.perfil-hero::after {
    content: '';
    position: absolute;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(240,138,36,0.08);
    right: 100px; bottom: -80px;
    pointer-events: none;
}
.perfil-avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 3px solid rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: #fff;
    flex-shrink: 0;
    position: relative; z-index: 1;
    letter-spacing: .02em;
}
.perfil-hero__info { flex: 1; position: relative; z-index: 1; }
.perfil-badge {
    display: inline-block;
    background: rgba(240,138,36,0.18);
    color: #F08A24;
    border: 1px solid rgba(240,138,36,0.35);
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 10px;
}
.perfil-nome {
    font-size: 26px; font-weight: 800; color: #fff;
    margin: 0 0 4px; line-height: 1.2;
}
.perfil-email { font-size: 14px; color: rgba(255,255,255,0.55); margin: 0; }

/* ── Grelha de formulários ──────────────────────── */
.perfil-grelha {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: start;
}
.perfil-painel { background: #fff; border: 1px solid #D4D4D4; border-radius: 12px; overflow: hidden; }
.perfil-painel__cabecalho {
    padding: 20px 24px;
    border-bottom: 1px solid #D4D4D4;
    display: flex; align-items: center; gap: 14px;
}
.perfil-painel__icone {
    width: 36px; height: 36px; border-radius: 8px;
    background: #F5F5F5; border: 1px solid #D4D4D4;
    display: flex; align-items: center; justify-content: center;
    color: #0B2240; flex-shrink: 0;
}
.perfil-painel__icone svg { width: 18px; height: 18px; }
.perfil-painel__titulo { font-size: 16px; font-weight: 700; color: #0B2240; margin: 0; }
.perfil-painel__corpo { padding: 28px 24px; }
.perfil-campo { margin-bottom: 20px; }
.perfil-campo label {
    display: block; font-size: 12px; font-weight: 600;
    color: #5A5A5A; text-transform: uppercase; letter-spacing: .06em;
    margin-bottom: 6px;
}
.perfil-campo input {
    width: 100%; box-sizing: border-box;
    padding: 10px 14px;
    border: 1.5px solid #D4D4D4; border-radius: 8px;
    font-size: 14px; color: #1A1A1A;
    background: #FAFAFA;
    transition: border-color .15s, background .15s;
    font-family: inherit;
}
.perfil-campo input:focus {
    outline: none;
    border-color: #0B2240;
    background: #fff;
}
.perfil-msg {
    padding: 10px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    margin-bottom: 20px; display: none;
}
.perfil-msg--ok  { background: #F0FDF4; color: #15803D; border: 1px solid #BBF7D0; }
.perfil-msg--err { background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }
@media (max-width: 860px) { .perfil-grelha { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .perfil-hero { padding: 28px 24px; flex-direction: column; text-align: center; } }
</style>
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar"></aside>
    <div>
        <header class="app-topbar"></header>
        <main class="app-main">

            <div class="app-cabecalho">
                <div class="app-cabecalho__titulo">
                    <h1>A minha conta</h1>
                    <p>Gira os seus dados pessoais e acesso à plataforma.</p>
                </div>
            </div>

            <!-- Hero -->
            <div class="perfil-hero">
                <div class="perfil-avatar" id="hero-avatar">--</div>
                <div class="perfil-hero__info">
                    <div class="perfil-badge">Gestor</div>
                    <p class="perfil-nome" id="hero-nome">A carregar...</p>
                    <p class="perfil-email" id="hero-email"></p>
                </div>
            </div>

            <!-- Formulários -->
            <div class="perfil-grelha">

                <div class="perfil-painel">
                    <div class="perfil-painel__cabecalho">
                        <div class="perfil-painel__icone">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <h2 class="perfil-painel__titulo">Dados pessoais</h2>
                    </div>
                    <div class="perfil-painel__corpo">
                        <div id="msg-perfil" class="perfil-msg"></div>
                        <form id="form-perfil">
                            <div class="perfil-campo">
                                <label>Nome completo</label>
                                <input type="text" id="perfil-nome" placeholder="O seu nome">
                            </div>
                            <div class="perfil-campo">
                                <label>Email</label>
                                <input type="email" id="perfil-email" placeholder="email@exemplo.com">
                            </div>
                            <div class="perfil-campo" id="campo-telemovel" style="display:none;">
                                <label>Telemóvel</label>
                                <input type="tel" id="perfil-telemovel" placeholder="+351 9xx xxx xxx">
                            </div>
                            <div class="perfil-campo" id="campo-empresa" style="display:none;">
                                <label>Empresa</label>
                                <input type="text" id="perfil-empresa" placeholder="Nome da empresa">
                            </div>
                            <button type="submit" class="btn btn--primario" style="width:100%;margin-top:8px;">Guardar alterações</button>
                        </form>
                    </div>
                </div>

                <div class="perfil-painel">
                    <div class="perfil-painel__cabecalho">
                        <div class="perfil-painel__icone">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </div>
                        <h2 class="perfil-painel__titulo">Alterar password</h2>
                    </div>
                    <div class="perfil-painel__corpo">
                        <div id="msg-pw" class="perfil-msg"></div>
                        <form id="form-pw">
                            <div class="perfil-campo">
                                <label for="pw-atual">Password atual</label>
                                <input type="password" id="pw-atual" autocomplete="current-password" required placeholder="••••••••">
                            </div>
                            <div class="perfil-campo">
                                <label for="pw-nova">Nova password</label>
                                <input type="password" id="pw-nova" autocomplete="new-password" required placeholder="Mín. 8 caracteres, maiúscula e número">
                            </div>
                            <div class="perfil-campo">
                                <label for="pw-confirmar">Confirmar nova password</label>
                                <input type="password" id="pw-confirmar" autocomplete="new-password" required placeholder="Repetir nova password">
                            </div>
                            <button type="submit" class="btn btn--primario" style="width:100%;margin-top:8px;">Guardar nova password</button>
                        </form>
                    </div>
                </div>

            </div>

        </main>
    </div>
</div>
<script src="../visuais/js/api.js"></script>
<script src="../visuais/js/toast.js"></script>
<script src="js/app.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
