<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas — Gestão de Condomínios</title>
    <link rel="stylesheet" href="../visuais/css/tokens.css">
    <link rel="stylesheet" href="../visuais/css/base.css">
    <link rel="stylesheet" href="../visuais/css/componentes.css">
    <link rel="stylesheet" href="css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">
    <div class="app-shell">
        <aside class="app-sidebar"></aside>
        <div>
            <header class="app-topbar"></header>
            <main class="app-main">

                <div class="app-cabecalho">
                    <div class="app-cabecalho__titulo">
                        <h1>Reservas de espaços</h1>
                        <p>Reservas pendentes de aprovação e histórico.</p>
                    </div>
                </div>

                <div class="app-filtros">
                    <input type="search" placeholder="Procurar..." data-pesquisa>
                </div>
                <div class="filtro-chips" id="chips-estado">
                    <button class="filtro-chip ativo" data-estado="">Todas</button>
                    <button class="filtro-chip" data-estado="ativa">Ativas</button>
                    <button class="filtro-chip" data-estado="cancelada">Canceladas</button>
                </div>

                <div class="painel">
                    <table class="app-tabela">
                        <thead>
                            <tr>
                                <th>Condómino</th>
                                <th>Espaço</th>
                                <th>Início</th>
                                <th>Fim</th>
                                <th>Valor</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody data-tabela="reservas">
                            <tr><td colspan="6" class="app-vazio"><p>A carregar...</p></td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="../visuais/js/api.js"></script>
    <script src="../visuais/js/toast.js"></script>
    <script src="js/app.js"></script>
    <script src="js/listagem.js"></script>
    <script src="js/reservas.js"></script>
</body>
</html>
