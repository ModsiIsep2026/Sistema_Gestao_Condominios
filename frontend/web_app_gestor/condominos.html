<!DOCTYPE html>
<html lang="pt">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condóminos — Gestão de Condomínios</title>
<link rel="stylesheet" href="../visuais/css/tokens.css">
<link rel="stylesheet" href="../visuais/css/base.css">
<link rel="stylesheet" href="../visuais/css/componentes.css">
<link rel="stylesheet" href="css/app.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar"></aside>
    <div>
        <header class="app-topbar"></header>
        <main class="app-main">

            <div class="app-cabecalho">
                <div class="app-cabecalho__titulo">
                    <h1>Condóminos</h1>
                    <p>Pessoas com fração nos seus edifícios.</p>
                </div>
                <div class="app-cabecalho__acoes">
                    <button type="button" class="btn btn--primario" id="btn-adicionar-cond" style="display:none;">
                        Adicionar condómino
                    </button>
                </div>
            </div>

            <!-- Seletor de edifício -->
            <div class="app-filtros" style="margin-bottom:var(--esp-5);">
                <select id="sel-edificio" style="min-width:320px;">
                    <option value="">Selecionar edifício...</option>
                </select>
            </div>

            <!-- Conteúdo -->
            <div id="condominos-container">
                <p style="color:var(--cor-texto-secundario);">Seleciona um edifício para ver os condóminos.</p>
            </div>

        </main>
    </div>
</div>

<!-- Modal: adicionar condómino -->
<div class="modal-overlay" id="modal-cond" hidden>
    <div class="modal" style="max-width:480px;">
        <div class="modal__cabecalho">
            <h3>Adicionar condómino</h3>
            <button type="button" class="modal__fechar" data-fechar-cond>&times;</button>
        </div>
        <div class="modal__corpo">
            <div id="modal-cond-edificio"
                 style="background:var(--cor-fundo);padding:10px 14px;border-radius:6px;
                        font-size:13px;color:var(--cor-texto-secundario);margin-bottom:var(--esp-4);">
            </div>
            <div id="erro-cond" class="login-erro" style="display:none;margin-bottom:var(--esp-3);"></div>
            <form id="form-cond">
                <div class="campo">
                    <label for="cond-nome">Nome completo</label>
                    <input type="text" id="cond-nome" required>
                </div>
                <div class="campo">
                    <label for="cond-email">Email</label>
                    <input type="email" id="cond-email" required>
                </div>
                <div class="campo">
                    <label for="cond-apt">Apartamento / Fração</label>
                    <select id="cond-apt" required>
                        <option value="">Selecionar fração...</option>
                    </select>
                </div>
            </form>
        </div>
        <div class="modal__rodape">
            <button type="button" class="btn btn--outline" data-fechar-cond>Cancelar</button>
            <button type="button" class="btn btn--primario" id="btn-guardar-cond">Adicionar</button>
        </div>
    </div>
</div>

<script src="../visuais/js/api.js"></script>
<script src="../visuais/js/toast.js"></script>
<script src="js/app.js"></script>
<script src="js/condominos.js"></script>
</body>
</html>
