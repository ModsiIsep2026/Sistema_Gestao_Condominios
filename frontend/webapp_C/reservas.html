<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar espaço — Gestão de Condomínios</title>
    <link rel="stylesheet" href="../visuais/css/tokens.css">
    <link rel="stylesheet" href="../visuais/css/base.css">
    <link rel="stylesheet" href="../visuais/css/componentes.css">
    <link rel="stylesheet" href="../webapp_AG/css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">

    <div class="app-shell">
        <aside class="app-sidebar"></aside>

        <div>
            <header class="app-topbar"></header>
            <main class="app-main">

                <div class="app-cabecalho">
                    <div class="app-cabecalho__titulo">
                        <h1>Reservar espaço</h1>
                        <p>Consulte a disponibilidade e reserve espaços comuns do seu condomínio.</p>
                    </div>
                    <div class="app-cabecalho__acoes">
                        <button type="button" class="btn btn--primario" id="btn-nova-reserva">Nova reserva</button>
                    </div>
                </div>

                <!-- As minhas reservas -->
                <div class="painel" style="margin-bottom:var(--esp-5);">
                    <div class="painel__cabecalho">
                        <h2>As minhas reservas</h2>
                    </div>
                    <div class="painel__corpo painel__corpo--sem-pad">
                        <table class="app-tabela">
                            <thead>
                                <tr>
                                    <th>Espaço</th>
                                    <th>Início</th>
                                    <th>Fim</th>
                                    <th>Valor</th>
                                </tr>
                            </thead>
                            <tbody data-tabela="minhas-reservas">
                                <tr><td colspan="4" class="app-vazio"><p>A carregar...</p></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Consultar disponibilidade -->
                <div class="painel">
                    <div class="painel__cabecalho">
                        <h2>Disponibilidade por espaço</h2>
                    </div>
                    <div class="painel__corpo">
                        <div class="campo" style="max-width:320px;margin-bottom:var(--esp-4);">
                            <label for="sel-espaco">ID do espaço</label>
                            <select id="sel-espaco">
                                <option value="">— Introduza o ID do espaço —</option>
                            </select>
                        </div>
                        <div id="calendario-reservas"
                             style="background:var(--cor-fundo-alt);border:1px solid var(--cor-borda);
                                    padding:var(--esp-4);font-size:var(--tam-sm);color:var(--cor-texto-suave);">
                            Selecione um espaço para ver a disponibilidade.
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Modal: nova reserva -->
    <div class="modal-overlay" id="modal-reserva" hidden>
        <div class="modal">
            <div class="modal__cabecalho">
                <h3>Nova reserva</h3>
                <button type="button" class="modal__fechar" data-fechar-modal>&times;</button>
            </div>
            <div class="modal__corpo">
                <div id="erro-reserva" class="login-erro" hidden></div>
                <form id="form-reserva">
                    <div class="campo">
                        <label for="r-espaco">ID do espaço</label>
                        <input type="number" id="r-espaco" min="1" required
                               placeholder="Consulte o gestor para saber o ID">
                    </div>
                    <div class="campo">
                        <label for="r-inicio">Data e hora de início</label>
                        <input type="datetime-local" id="r-inicio" required>
                    </div>
                    <div class="campo">
                        <label for="r-fim">Data e hora de fim</label>
                        <input type="datetime-local" id="r-fim" required>
                    </div>
                </form>
            </div>
            <div class="modal__rodape">
                <button type="button" class="btn btn--outline" data-fechar-modal>Cancelar</button>
                <button type="button" class="btn btn--primario" id="btn-confirmar-reserva">Confirmar reserva</button>
            </div>
        </div>
    </div>

    <script src="../visuais/js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reservas.js"></script>
</body>
</html>
