<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a password — Sistema de Gestão de Condomínios</title>

    <link rel="stylesheet" href="../shared/css/tokens.css">
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/componentes.css">
    <link rel="stylesheet" href="css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-fundo">
        <img src="../shared/img/predios.jpg" alt="">
        <div class="login-fundo__overlay"></div>
    </div>

    <main class="login-conteudo">
        <a href="login.html" class="login-voltar">&larr; Voltar ao login</a>

        <div class="login-card">

            <div class="login-card__topo">
                <a href="index.html" class="login-logo">
                    <img src="../shared/img/logo.png" alt="Sistema de Gestão de Condomínios">
                </a>
                <h1>Esqueceu-se da password ?</h1>
                <p>Insira o seu email e enviaremos instruções para recuperar a sua conta.</p>
            </div>

            <div id="esqueci-erro" class="login-erro" hidden></div>
            <div id="esqueci-sucesso" class="login-sucesso" hidden></div>

            <form id="esqueci-form" class="login-form" novalidate>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email"
                           id="email"
                           name="email"
                           autocomplete="username"
                           placeholder="1211405@isep.ipp.pt"
                           required>
                </div>

                <button type="submit" class="btn btn--primario btn--bloco">Enviar instruções</button>
            </form>

            <p class="login-rodape">
                Já tem conta? <a href="login.html">Entrar</a>
            </p>

        </div>
    </main>

    <script src="../shared/js/api.js"></script>
    <script src="js/pw_loss.js"></script>
</body>
</html>
